name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build offline neural runtime pack
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.7.1
          python -m pip install onnx==1.18.0 onnxruntime==1.22.0 numpy scipy

          mkdir -p .runtime app/src/main/assets/runtime
          git clone --depth 1 https://github.com/RVC-Project/Retrieval-based-Voice-Conversion-WebUI.git .runtime/rvc

          python tools/export_generic_rvc_onnx.py \
            --rvc-root .runtime/rvc \
            --out app/src/main/assets/runtime/rvc_v2_f0_40k_s109.onnx \
            --manifest app/src/main/assets/runtime/rvc_weights_manifest.json

          curl -L --fail --retry 3 \
            https://huggingface.co/TigreGotico/voiceclonnx-rvc/resolve/main/contentvec_768l12_q8.onnx \
            -o app/src/main/assets/runtime/contentvec_v2.onnx
          curl -L --fail --retry 3 \
            https://huggingface.co/TigreGotico/voiceclonnx-rvc/resolve/main/rmvpe_q8.onnx \
            -o app/src/main/assets/runtime/rmvpe.onnx

          python - <<'PY'
          import onnx
          from pathlib import Path
          for p in [Path('app/src/main/assets/runtime/contentvec_v2.onnx'), Path('app/src/main/assets/runtime/rmvpe.onnx')]:
              m = onnx.load(str(p), load_external_data=False)
              print('\nMODEL', p, f'{p.stat().st_size / 1024**2:.1f} MiB')
              print(' inputs:')
              for x in m.graph.input:
                  dims = [d.dim_value if d.dim_value else d.dim_param for d in x.type.tensor_type.shape.dim]
                  print('  ', x.name, x.type.tensor_type.elem_type, dims)
              print(' outputs:')
              for x in m.graph.output:
                  dims = [d.dim_value if d.dim_value else d.dim_param for d in x.type.tensor_type.shape.dim]
                  print('  ', x.name, x.type.tensor_type.elem_type, dims)
          PY

          test -s app/src/main/assets/runtime/contentvec_v2.onnx
          test -s app/src/main/assets/runtime/rmvpe.onnx
          test -s app/src/main/assets/runtime/rvc_v2_f0_40k_s109.onnx
          test -s app/src/main/assets/runtime/rvc_weights_manifest.json
          du -h app/src/main/assets/runtime/*

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify runtime is packaged
        shell: bash
        run: |
          set -euxo pipefail
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/runtime/contentvec_v2.onnx'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/runtime/rmvpe.onnx'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/runtime/rvc_v2_f0_40k_s109.onnx'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/runtime/rvc_weights_manifest.json'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PTHChanger-debug
          path: app/build/outputs/apk/debug/app-debug.apk
